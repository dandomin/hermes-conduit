name: Probe 1250
on:
  push:
    branches: [probe/1250]
jobs:
  voice:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      SIMULATOR_NAME: "iPhone 17 Pro"
      DERIVED_DATA_PATH: "${{ github.workspace }}/ci-derived-data"
      BUILD_TIMEOUT_SECS: 1500
      BUILD_CACHE: none
    steps:
      - uses: actions/checkout@v7
      - run: sudo xcode-select -s /Applications/Xcode.app
      - run: brew install xcodegen
      - run: xcodegen generate --spec project-tests.yml
      - run: bash scripts/ci-hosted-build.sh
      - name: Voice unit classes
        run: |
          set -o pipefail
          xcodebuild test-without-building -xctestrun "$XCRUN_FILE" -destination "$DESTINATION" \
            -parallel-testing-enabled NO -collect-test-diagnostics never \
            -only-testing:ConduitTests/AppStateScreenQuestionTests \
            -only-testing:ConduitTests/AppStateVoiceCapabilityTests \
            -only-testing:ConduitTests/AppStateVoiceSpokenPhraseTests \
            -only-testing:ConduitTests/AppStateVoiceSuspensionTests \
            -only-testing:ConduitTests/CarPlayVoiceCoordinatorTests \
            -only-testing:ConduitTests/CarPlayVoiceLifecycleRegressionTests \
            -only-testing:ConduitTests/CarPlayVoicePhoneAttachTests \
            -only-testing:ConduitTests/HermesVoiceGatewayTimeoutTests \
            -only-testing:ConduitTests/LocalLiveJobNoticeTests \
            -only-testing:ConduitTests/ScreenQuestionTests \
            -only-testing:ConduitTests/VoiceConversationControllerTests \
            -only-testing:ConduitTests/ContinuousConversationPreferenceTests \
            -only-testing:ConduitTests/VoiceSpokenCommandMatchingTests \
            2>&1 | tee unit.log | grep -E "error:|failed|Executed" | tail -300
